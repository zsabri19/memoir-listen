<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1a2e" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Listen · Ch 13" />
  <title>Listen · Chapter Thirteen — AI as Interpreter, Not Replacement</title>
  <link rel="stylesheet" href="../css/listen.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;display=swap" rel="stylesheet" />
</head>
<body class="listen-page">

  <header class="listen-head">
    <a class="listen-brand" href="https://global-mkts.com/book">
      <img src="../assets/clarity-voice-logo.png" alt="" width="34" height="34" />
      <span>From Exile to Transformation</span>
    </a>
    <span class="listen-read">Audio only</span>
  </header>

  <main class="listen-stage" id="player" data-src="../assets/audio/ch-13.mp3" data-spoken="../assets/audio/ch-13.spoken.js" data-title="AI as Interpreter" data-kicker="Chapter Thirteen" data-artist="Zeeshan Sabri" data-artwork="../assets/clarity-voice-logo.png">

    <p class="listen-test">Chapter XIII · Audio only</p>

    <p class="listen-numeral">XIII</p>
    <h1>AI as Interpreter, Not Replacement</h1>
    <p class="listen-part">Part III · The Nation OS · Zeeshan Sabri</p>

    <button type="button" class="listen-play" id="play" aria-label="Play">
      <span class="listen-play-ring" aria-hidden="true"></span>
      <span class="listen-play-icon" id="play-icon" aria-hidden="true">▶</span>
    </button>

    <div class="listen-progress" id="progress" role="slider" aria-label="Position" tabindex="0">
      <div class="listen-progress-fill" id="fill"></div>
    </div>
    <div class="listen-time">
      <span id="elapsed">0:00</span>
      <span id="remain">0:00</span>
    </div>

    <div class="listen-transport">
      <button type="button" class="listen-skip" data-skip="-15" aria-label="Back 15 seconds">−15</button>
      <button type="button" class="listen-skip" data-skip="15" aria-label="Forward 15 seconds">+15</button>
    </div>

    <div class="listen-speeds" id="speeds" role="group" aria-label="Playback speed">
      <span class="listen-speeds-label">Speed</span>
      <button type="button" class="listen-speed" data-speed="0.75">0.75×</button>
      <button type="button" class="listen-speed" data-speed="1">1×</button>
      <button type="button" class="listen-speed" data-speed="1.25">1.25×</button>
      <button type="button" class="listen-speed" data-speed="1.5">1.5×</button>
      <button type="button" class="listen-speed" data-speed="2">2×</button>
    </div>

    <p class="listen-line" id="line">Tap play. Zeeshan reads Chapter Thirteen.</p>

    <p class="listen-hint">This link is Chapter Thirteen only.</p>
  </main>

  <footer class="listen-foot">
    <img src="../assets/clarity-voice-logo.png" alt="" width="40" height="40" />
    <span>Clarity Voice</span>
  </footer>

  <script src="../js/listen.js"></script>
</body>
</html>
